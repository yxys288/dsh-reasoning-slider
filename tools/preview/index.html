<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-reasoning-slider — 视觉预览</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--dsw-alias-bg-base, #ffffff);
    color: var(--dsw-alias-label-primary, #1a1a1a);
    font-family: var(--dsw-font-family, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif);
  }
  #stage { display: flex; flex-direction: column; gap: 18px; padding: 24px 28px 32px; }
  h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; color: var(--dsw-alias-label-primary, #1a1a1a); }
  .sub { margin: 0 0 6px; font-size: 12px; color: var(--dsw-alias-label-tertiary, #8a8a92); }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .cap { font-size: 12px; line-height: 16px; color: var(--dsw-alias-label-tertiary, #8a8a92); }
  .composer {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px 7px 14px; width: max-content; min-width: 460px;
    border: 1px solid var(--dsw-alias-border-l2, #e0e0e4);
    border-radius: 20px;
    background: var(--dsw-alias-bg-layer-2, #fafafa);
  }
  .fakeinput { flex: 1; font-size: 13px; color: var(--dsw-alias-label-quaternary, #a8a8b0); }
  .seat { flex: none; }
  #errors {
    display: none; margin: 12px 28px; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap;
    background: var(--dsw-alias-interactive-bg-hover-danger, rgba(248,113,113,.16));
    color: var(--dsw-alias-state-error-primary, #f87171);
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
  }
</style>
</head>
<body>
  <div id="errors"></div>
  <div id="stage"></div>
  <script>window.process = { env: { NODE_ENV: 'development' } };</script>
  <script src="react.js"></script>
  <script src="react-dom.js"></script>
  <script>
    window.__ModuleLoader__ = { load: function (entry) { window.__entry = entry; } };
    // The shipped theme keys dark tokens off `body[data-ds-dark-theme]`.
    if (new URLSearchParams(location.search).get('theme') === 'dark') {
      document.body.setAttribute('data-ds-dark-theme', '');
    }
  </script>
  <script src="seat.js"></script>
  <script src="harness.js"></script>
</body>
</html>
